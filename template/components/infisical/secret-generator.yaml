# Creates Secret infisical/infisical-secrets once, if it is absent, so a fresh
# cluster reaches Synced/Healthy with no manual step. It never overwrites: the
# ENCRYPTION_KEY encrypts every secret Infisical stores, and replacing it would
# make them unreadable. To bring your own values, create the Secret before the
# first sync; this Job will then leave it alone.
#
# All four objects are PreSync hooks of the `infisical` Application, so they
# run before the chart's Deployment exists, and are recreated on each sync
# (BeforeHookCreation), which keeps them cheap to re-run and never stale.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-secret-generator
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infisical-secret-generator
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [infisical-secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infisical-secret-generator
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infisical-secret-generator
subjects:
  - kind: ServiceAccount
    name: infisical-secret-generator
---
apiVersion: batch/v1
kind: Job
metadata:
  name: infisical-secret-generator
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: infisical-secret-generator
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          # alpine/k8s 1.37.0: kubectl plus a shell and openssl.
          image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
          env:
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -ec
            - |
              if kubectl get secret infisical-secrets >/dev/null 2>&1; then
                echo "infisical-secrets exists; leaving it alone"
                exit 0
              fi
              # Infisical's self-hosting guide: ENCRYPTION_KEY is 16 random
              # bytes as hex, AUTH_SECRET 32 random bytes as base64.
              kubectl create secret generic infisical-secrets \
                --from-literal=ENCRYPTION_KEY="$(openssl rand -hex 16)" \
                --from-literal=AUTH_SECRET="$(openssl rand -base64 32)" \
                --from-literal=SITE_URL="http://localhost:8080"
              echo "created infisical-secrets"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
