# Strategic-merge patch on upstream's argocd-cm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Track by annotation, not by the app.kubernetes.io/instance label, so a
  # chart that sets that label itself (most do) is not mistaken for ours, and
  # resources a helm install created can be adopted cleanly.
  application.resourceTrackingMethod: annotation
  # Lets a kustomization under components/ inflate helm charts.
  kustomize.buildOptions: --enable-helm
  # Argo CD (install.yaml) ignores every resource's /status updates by default
  # (resource.customizations.ignoreResourceUpdates.all). Then a hook Job that
  # completed, or an ExternalSecret, OriginIssuer or Certificate that went
  # Ready, is seen only at the next three-minute reconcile, and a sync wave
  # waits that long for each (workspace TODO 188: the edge took about 30
  # minutes twice on Google run 1). Ignore lists only add up, so no kind can be
  # exempted from .all: it is emptied here, and upstream's per-kind ignores
  # (ConfigMap, Endpoints, ReplicaSet, Application, EndpointSlice, ...) stay.
  resource.customizations.ignoreResourceUpdates.all: |
    jsonPointers: []

