# Argo CD for the management cluster. Verbatim (not a template), so every
# gitops repo made from this template carries the same bytes.
#
# The operator runs a kustomize build of this directory and server-side applies
# it once, at bootstrap. From wave 100 on, the `argocd` Application points here
# and Argo CD manages itself: change this directory, not the live cluster.
#
# Upstream is vendored by scripts/vendor-argocd.sh (Argo CD v3.5.3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - install.yaml
  - infrared-charts-repo.yaml
patches:
  - path: argocd-cm.yaml
  - path: argocd-cmd-params-cm.yaml
